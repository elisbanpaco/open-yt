name: Build Release Binaries

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            binary_path: dist/open-yt
            release_name: open-yt-linux
          - os: windows-latest
            binary_path: dist/open-yt.exe
            release_name: open-yt-windows.exe
          - os: macos-latest
            binary_path: dist/open-yt
            release_name: open-yt-macos

    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4

    - name: 🐍 Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 Instalar dependencias
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    - name: 🔨 Compilar ejecutable con PyInstaller
      shell: bash
      run: pyinstaller --onefile --name open-yt --hidden-import rich --hidden-import questionary --hidden-import typer --hidden-import pydantic_settings src/main.py

    - name: 🏷️ Renombrar binario
      shell: bash
      run: mv ${{ matrix.binary_path }} dist/${{ matrix.release_name }}

    - name: 🚀 Subir a GitHub Releases
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v0.0.1
        files: dist/${{ matrix.release_name }}
