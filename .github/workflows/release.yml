name: Build Release Binaries

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            binary_path: dist/open-yt
            release_name: open-yt-linux
          - os: windows-latest
            binary_path: dist/open-yt.exe
            release_name: open-yt-windows.exe
          - os: macos-latest
            binary_path: dist/open-yt
            release_name: open-yt-macos

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install .

    - name: Build executable with PyInstaller
      shell: bash
      run: pyinstaller --onefile --name open-yt --hidden-import rich --hidden-import questionary --hidden-import typer --hidden-import pydantic_settings --hidden-import yt_dlp --hidden-import mutagen src/open_yt/main.py

    - name: Rename binary
      shell: bash
      run: mv ${{ matrix.binary_path }} dist/${{ matrix.release_name }}

    - name: Upload to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        files: dist/${{ matrix.release_name }}
