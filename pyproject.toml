[project]
name = "open-yt"
version = "0.0.1"
description = "CLI profesional para descargar contenido de YouTube"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "yt-dlp>=2024.8.0",
    "pydantic-settings>=2.3.0",
    "questionary>=2.0.0",
    "pyfiglet>=0.8.post0",
    "tomli-w>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "nuitka>=2.0.0",
]

[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[tool.nuitka]
onefile = true
standalone = true
