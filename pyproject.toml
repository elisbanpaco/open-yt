[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-yt"
version = "0.1.3.1"
description = "CLI profesional y minimalista para descargar contenido de YouTube"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mutagen>=1.47.0",
    "pydantic-settings>=2.14.1",
    "pyfiglet>=1.0.4",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "tomli>=2.0.1; python_version < '3.11'",
    "tomli-w>=1.2.0",
    "typer>=0.25.1",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
open-yt = "open_yt.main:cli_main"

[tool.hatch.build.targets.wheel]
packages = ["src/open_yt"]
